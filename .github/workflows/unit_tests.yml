name: tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install uv (adds caching automatically)
      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      # Ensure Python 3.13 is available for uv environments
      - name: Install Python 3.13 for uv
        run: uv python install 3.13

      # Headless display for PyVista
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v2

      # Resolve + create project venv with dev deps
      - name: Sync dependencies (prod + dev)
        run: uv sync --group dev

      # Lint (use project venv via `uv run`)
      - name: Lint (black + isort)
        run: |
          uv run black --check --line-length 100 .
          uv run isort --check-only .

      # Tests (run twice: JIT off/on)
      - name: Test with pytest (Numba JIT disabled)
        run: |
          NUMBA_DISABLE_JIT=1 uv run pytest -q tests/
      - name: Test with pytest (Numba JIT enabled)
        run: |
          NUMBA_DISABLE_JIT=0 uv run pytest -q tests/

      # Optional: coverage (kept close to your Makefile target)
      # - name: Coverage
      #   run: |
      #     NUMBA_DISABLE_JIT=1 uv run pytest --cov=building3d --cov-report=xml --cov-report=term-missing tests/
      #   # You can upload coverage.xml to Codecov here if you use it.

