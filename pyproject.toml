[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "building3d"
authors = [
    {name = "Krzysztof Arendt", email = "16005748+krzysztofarendt@users.noreply.github.com"},
]
description = "Towards 3D building modeling and simulation"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotbimpy>=0.1.0",
    "imageio[ffmpeg]>=2.37.0",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.4.7",
    "librosa>=0.11.0",
    "matplotlib>=3.10.6",
    "numba>=0.61.2",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pyvista[all]>=0.46.3",
    "scipy>=1.16.1",
    "soundfile>=0.13.1",
    "tqdm>=4.67.1",
]

[tool.setuptools]
packages = ["building3d"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
]
